name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Format
        run: bun run check
      - name: Scripts parse
        run: for f in fidelity/scripts/*.mjs fidelity/harness/*.mjs; do node --check "$f"; done
