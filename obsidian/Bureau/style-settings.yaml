mode: replace
sections:
  - name: Bureau
    id: bureau
    collapsed: false
    settings:
      - id: bu-whatsnew-note
        title: What's new — v2.9.3
        description: |-
          **Bureau v2.9.3**

          - **New README hero** — the README now leads with the Bureau wallpaper artwork (full 1536×1024, served as a 264 KB webp) in place of the small store screenshot. Docs/asset only — no theme changes.

          Full release history is at the foot of this panel. **Updates:** install via the community-themes browser or [BRAT](https://github.com/TfTHacker/obsidian42-brat) to be notified automatically; otherwise re-download `theme.css` from the [releases page](https://github.com/Sonophage/Bureau).
        type: info-text
        markdown: true
      - id: bu-reset-note
        title: Reset all options
        description: 'To restore every Bureau setting to its default: open this Style Settings pane''s header row and click the reset (↻ "Reset all settings") button. Every option below has a defined default, so the reset is clean.'
        type: info-text
        markdown: true
      - id: bu-mode-heading
        title: Mode
        description: Quick effect presets and the inverted-editor toggle — start here.
        type: heading
        level: 2
        collapsed: true
      - id: bu-mode
        title: Effects mode
        description: Quick preset. Low = base styling only · Medium = + textures & glow · High = everything on · Custom = use the toggles below. Your toggles are always preserved — Custom restores them. While Low or Medium is active it overrides those toggles; switch to Custom to use them.
        type: class-select
        default: bu-mode-custom
        allowEmpty: false
        options:
          - label: Low
            value: bu-mode-low
          - label: Medium
            value: bu-mode-medium
          - label: High
            value: bu-mode-high
          - label: Custom
            value: bu-mode-custom
      - id: bu-color-heading
        title: Color & accent
        description: Accent preset and custom colour, per-mode text, and black / white levels.
        type: heading
        level: 2
        collapsed: true
      - id: bu-split-editor
        title: Inverted editor (opposite palette to the chrome)
        description: Render the editor pane in the OPPOSITE palette to the rest of the UI — paper page on dark chrome in dark mode, dark page on light chrome in light mode. Flip Obsidian's light/dark appearance to switch which is which (a theme can't change that mode itself).
        type: class-toggle
        default: false
      - id: bu-accent
        title: Accent preset
        description: Accent colour used across the whole UI and the glow.
        type: variable-select
        default: var(--bu-control)
        options:
          - label: Control (red)
            value: var(--bu-control)
          - label: Magnus (green)
            value: var(--bu-magnus)
          - label: Deus (gold)
            value: var(--bu-deus)
          - label: Amber (phosphor)
            value: var(--bu-amber)
          - label: Green (P1 phosphor)
            value: var(--bu-p1)
          - label: Custom
            value: var(--bu-accent-custom)
      - id: bu-accent-custom
        title: Custom accent
        description: Used when Accent preset is set to Custom.
        type: variable-color
        format: hex
        opacity: false
        default: '#e23b2c'
        alt-format: []
      - id: bu-phosphor
        title: Phosphor terminal (tint text to accent)
        description: Monochrome vintage-terminal look. Tints the dark-mode body text to the accent colour, so the type itself glows in one hue. Pair it with the Amber or Green (P1) accent preset above (any accent works). Use a bright accent — it recolours all body text, so a dark custom accent will hurt readability. Dark-mode effect.
        type: class-toggle
        default: false
      - id: bu-text-dark
        title: Text colour — dark mode
        description: Body text colour while the dark theme is active.
        type: variable-color
        format: hex
        opacity: false
        default: '#f1efea'
        alt-format: []
      - id: bu-text-light
        title: Text colour — light mode
        description: Body text (typewriter ink) while the paper/light theme is active.
        type: variable-color
        format: hex
        opacity: false
        default: '#1e1a14'
        alt-format: []
      - id: bu-black-level
        title: Black level — dark background
        description: How dark the base background is in dark mode (lower = blacker).
        type: variable-color
        format: hex
        opacity: false
        default: '#0c0b0a'
        alt-format: []
      - id: bu-white-level
        title: White level — light background
        description: How light the paper is in light mode (higher = whiter).
        type: variable-color
        format: hex
        opacity: false
        default: '#e7e0cd'
        alt-format: []
      - id: bu-atmos-heading
        title: Atmosphere
        description: Glow, film grain, vignette, shadow, and the accent halo — the ambient layer.
        type: heading
        level: 2
        collapsed: true
      - id: bu-glow-intensity
        title: Glow intensity
        description: Strength of the ambient accent glow at the bottom of the window (0 = off).
        type: variable-number-slider
        default: 13
        min: 0
        max: 40
        step: 1
      - id: bu-glow-reach
        title: Glow reach
        description: How far up the window the glow rises.
        type: variable-number-slider
        default: 95
        min: 30
        max: 160
        step: 5
      - id: bu-grain-opacity
        title: Film grain
        description: Fine noise over the whole window (0 = off).
        type: variable-number-slider
        default: 0.05
        min: 0
        max: 0.2
        step: 0.01
      - id: bu-shadow-strength
        title: Shadow strength
        description: Depth of shadows on callouts, properties, cards, the editor and side panels (0 = off).
        type: variable-number-slider
        default: 50
        min: 0
        max: 100
        step: 5
      - id: bu-panel-grain
        title: Sidebar texture
        description: Concrete grain on the side panels.
        type: class-toggle
        default: true
      - id: bu-panel-grain-amount
        title: Sidebar texture strength
        description: How visible the sidebar paper-grain texture is.
        type: variable-number-slider
        default: 0.38
        min: 0
        max: 0.7
        step: 0.02
      - id: bu-vignette-amount
        title: Vignette
        description: Darkened window edges — full ellipse in dark, top inverted-V (∧) in light (0 = off).
        type: variable-number-slider
        default: 0.5
        min: 0
        max: 0.9
        step: 0.05
      - id: bu-halo
        title: Accent halo
        description: A soft accent ring that breathes outward from the centre behind the UI. Set the strength below.
        type: class-toggle
        default: false
      - id: bu-halo-intensity
        title: ↳ Halo strength
        description: Peak intensity of the halo ring (0 = invisible).
        type: variable-number-slider
        default: 20
        min: 0
        max: 60
        step: 1
      - id: bu-crt-heading
        title: CRT
        description: Scanlines, phosphor text-glow, fullscreen tube mode, and the focus line.
        type: heading
        level: 2
        collapsed: true
      - id: bu-scanline-strength
        title: CRT scanlines
        description: Darkness of the horizontal scanlines over the editor (0 = off).
        type: variable-number-slider
        default: 0.34
        min: 0
        max: 0.6
        step: 0.02
      - id: bu-scanline-period
        title: Scanline spacing
        description: Pixels between scanlines (smaller = more lines).
        type: variable-number-slider
        default: 3
        min: 2
        max: 10
        step: 1
      - id: bu-glow-text
        title: CRT text glow
        description: Phosphor-style glow on body text (0 = off).
        type: variable-number-slider
        default: 55
        min: 0
        max: 100
        step: 5
      - id: bu-fullscreen-crt
        title: Fullscreen CRT mode
        description: In fullscreen, add a curved CRT-glass vignette, amp scanlines/glow, and recede the chrome.
        type: class-toggle
        default: true
      - id: bu-focus-line
        title: Focus line (dim the rest)
        description: Dim every line but the one you're editing and mark it with an accent edge.
        type: class-toggle
        default: false
      - id: bu-focus-dim
        title: ↳ Focus dim amount
        description: How dark the off-focus lines get (lower = dimmer).
        type: variable-number-slider
        default: 0.4
        min: 0.15
        max: 0.75
        step: 0.05
      - id: bu-cards-heading
        title: Cards & layout
        description: Float panes as cards, plus reading width, line-height and spacing dials.
        type: heading
        level: 2
        collapsed: true
      - id: bu-cards
        title: Cards layout
        description: Float every pane as a bordered card on a dark desk — the base the floating looks below build on.
        type: class-toggle
        default: true
      - id: bu-settings-horizontal
        title: Horizontal settings nav
        description: Reflow the settings window's left tab list into a scrolling strip across the top (desktop only).
        type: class-toggle
        default: false
      - id: bu-print-link-urls
        title: Print — show link URLs
        description: When printing or exporting to PDF, append each external link's address after it.
        type: class-toggle
        default: false
      - id: bu-card-gap-n
        title: Card gap
        description: Space between cards, in pixels.
        type: variable-number-slider
        default: 12
        min: 0
        max: 30
        step: 1
      - id: bu-card-radius-n
        title: Card rounding
        description: Corner radius, in pixels.
        type: variable-number-slider
        default: 12
        min: 0
        max: 28
        step: 1
      - id: bu-card-shadow
        title: Card shadow darkness
        description: How dark the drop-shadow under each card is.
        type: variable-number-slider
        default: 0.55
        min: 0
        max: 0.9
        step: 0.05
      - id: bu-card-shadow-blur
        title: Card shadow blur (px)
        description: How soft the drop-shadow under each card is.
        type: variable-number-slider
        default: 12
        min: 2
        max: 30
        step: 1
      - id: bu-card-shadow-spread
        title: Card shadow spread (px)
        description: Grows or tightens the drop-shadow; negative pulls it in.
        type: variable-number-slider
        default: 0
        min: -8
        max: 10
        step: 1
      - id: bu-line-width-n
        title: Reading line width
        description: Max line width with "Readable line length" on, in pixels.
        type: variable-number-slider
        default: 800
        min: 480
        max: 1200
        step: 10
      - id: bu-line-height
        title: Line height
        description: Body text line spacing.
        type: variable-number-slider
        default: 1.5
        min: 1.2
        max: 2.2
        step: 0.05
      - id: bu-p-spacing-n
        title: Paragraph spacing
        description: Gap between paragraphs, in pixels.
        type: variable-number-slider
        default: 16
        min: 0
        max: 36
        step: 1
      - id: bu-float-heading
        title: Floating & glass
        description: Optional soft/floating looks layered over the brutalist base. All off by default — the standard theme is untouched.
        type: heading
        level: 2
        collapsed: true
      - id: bu-float
        title: Heavier card float
        description: Deeper, larger drop shadow so panes float higher off the desk (needs Cards layout on).
        type: class-toggle
        default: false
      - id: bu-glass-cards
        title: Frosted glass panes
        description: Translucent, blurred editor and sidebar panes — the stage or your wallpaper shows through. Best paired with a custom background.
        type: class-toggle
        default: false
      - id: bu-flat-edges
        title: Flat card edges (no bevel)
        description: Drop the inset glass bevel on cards and panes but keep the drop shadow — flat edges instead of the lit lip.
        type: class-toggle
        default: false
      - id: bu-pill-chrome
        title: Pill terminal (floating editor)
        description: Lift the header into floating pills and float the editor as its own rounded card on the desk (the Ultra-Lobster look). Best with Cards layout on. Desktop only — auto-suppressed on phones/tablets, where the floating card breaks layout.
        type: class-toggle
        default: false
      - id: bu-pill-peek
        title: ↳ Pill terminal — hover to reveal
        description: With Pill terminal on, collapse the header pills until you hover or focus the row, reclaiming that space (needs Pill terminal).
        type: class-toggle
        default: false
      - id: bu-editor-only-cards
        title: Editor-only cards (flush sidebars)
        description: Only the editor floats as a card — strip the card border, rounding and shadow from the sidebars so they sit flush.
        type: class-toggle
        default: false
      - id: bu-pill-editor-heading
        title: Pill editor card
        description: The floating editor card in Pill terminal mode — its border and corner rounding. Needs Pill terminal on.
        type: heading
        level: 2
        collapsed: true
      - id: bu-pill-no-editor-border
        title: ↳ Remove editor card border
        description: Drop the outline around the floating editor card so only its shadow defines the edge.
        type: class-toggle
        default: false
      - id: bu-pill-editor-border-custom
        title: ↳ Custom editor card border colour
        description: Recolour the editor card outline with the colour below instead of the theme default.
        type: class-toggle
        default: false
      - id: bu-pill-editor-border-color
        title: ↳ Editor card border colour
        description: Used when "Custom editor card border colour" is on (and ignored when the border is removed).
        type: variable-color
        format: hex
        opacity: false
        default: '#564c3e'
        alt-format: []
      - id: bu-pill-editor-radius-n
        title: ↳ Editor card rounding
        description: Corner radius of the floating editor card, in pixels.
        type: variable-number-slider
        default: 12
        min: 0
        max: 28
        step: 1
      - id: bu-stacked-pill-top-n
        title: ↳ Stacked-tabs spine inset
        description: With stacked tabs on, how far the tab spine's top is pushed down to clear the floating pill header band, in pixels.
        type: variable-number-slider
        default: 44
        min: 0
        max: 80
        step: 1
      - id: bu-bg-heading
        title: Background
        description: A wallpaper behind the workspace, and an image on the New Tab pane. The wallpaper shows through Frosted glass panes (Floating & glass), so turn that on too.
        type: heading
        level: 2
        collapsed: true
      - id: bu-wallpaper
        title: Custom background image
        description: Show a wallpaper behind the workspace (best with Frosted glass). Set the image in the field below (a web URL, or a local image embedded as a base64 data URI). For a point-and-click local image, install the companion Redacted Background plugin via BRAT.
        type: class-toggle
        default: false
      - id: bu-wallpaper-url
        title: ↳ Background image — web URL
        description: 'Paste a full url(...) value. Web image: url(''https://example.com/bg.jpg''). LOCAL image: embed it as a data URI, url(''data:image/jpeg;base64,…'') (convert with any image-to-base64 tool). Pure CSS can''t point at a vault file by path. Leave as none to fall back to the Redacted Background plugin''s image, if installed. A remote web URL is re-fetched on every launch (that server sees your IP); a data URI keeps it fully local.'
        type: variable-text
        default: none
        quotes: false
      - id: bu-wallpaper-dim
        title: ↳ Background dim
        description: Scrim over the wallpaper for legibility (higher = darker/more paper, lower = more image).
        type: variable-number-slider
        default: 30
        min: 0
        max: 92
        step: 1
      - id: bu-new-tab-select
        title: New-tab image
        description: What to show on the New Tab / empty pane, above the stamp + actions. Bureau image is the packaged artwork; Custom URL uses the field below.
        type: class-select
        allowEmpty: false
        default: bu-new-tab-bureau
        options:
          - label: Bureau image
            value: bu-new-tab-bureau
          - label: 'Off'
            value: bu-new-tab-off
          - label: Custom URL
            value: bu-new-tab-custom
      - id: bu-new-tab-image
        title: ↳ New-tab image — custom URL
        description: Used when New-tab image is set to Custom URL. Paste a full url(...) value — a web URL, or a base64 data URI for a local file (same approach as the wallpaper field).
        type: variable-text
        default: url(" ")
        quotes: false
      - id: bu-new-tab-image-size
        title: New-tab image size (px)
        description: Width and height of the new-tab image.
        type: variable-number-slider
        default: 360
        min: 64
        max: 480
        step: 4
      - id: bu-tabs-heading
        title: Tabs
        description: Tab shape, what each dock's tabs show, and pinned-tab behaviour.
        type: heading
        level: 2
        collapsed: true
      - id: bu-tab-shape
        title: Tab shape
        description: Folder = connected file-folder tabs. Pill = fully-rounded floating tabs.
        type: class-select
        default: bu-tabs-folder
        allowEmpty: false
        options:
          - label: Folder (connected)
            value: bu-tabs-folder
          - label: Pill
            value: bu-tabs-pill
      - id: bu-dock-main
        title: Main tab content
        description: What the main editor tabs show — icon, title, or both.
        type: class-select
        default: bu-main-both
        allowEmpty: false
        options:
          - label: Icons + Labels
            value: bu-main-both
          - label: Icons only
            value: bu-main-icons
          - label: Labels only
            value: bu-main-labels
      - id: bu-dock-left
        title: Left sidebar tab content
        description: What the left sidebar tabs show — icon, label, or both.
        type: class-select
        default: bu-left-icons
        allowEmpty: false
        options:
          - label: Icons only
            value: bu-left-icons
          - label: Labels only
            value: bu-left-labels
          - label: Icons + Labels
            value: bu-left-both
      - id: bu-dock-right
        title: Right sidebar tab content
        description: What the right sidebar tabs show — icon, label, or both.
        type: class-select
        default: bu-right-icons
        allowEmpty: false
        options:
          - label: Icons only
            value: bu-right-icons
          - label: Labels only
            value: bu-right-labels
          - label: Icons + Labels
            value: bu-right-both
      - id: bu-pin-icon-only
        title: Pinned tabs — icon only
        description: Pinned tabs collapse to just their icon to save room.
        type: class-toggle
        default: false
      - id: bu-hide-heading
        title: Hide / Focus
        description: Focus Mode plus à-la-carte switches for hiding bits of chrome.
        type: heading
        level: 2
        collapsed: true
      - id: bu-focus
        title: Focus Mode
        description: Hides the tab bar, window buttons & status bar. Bind a hotkey to "Style Settings → Toggle Focus Mode".
        type: class-toggle
        default: false
      - id: bu-hide-status-bar
        title: Hide status bar
        type: class-toggle
        default: false
      - id: bu-hide-breadcrumbs
        title: Hide breadcrumbs
        type: class-toggle
        default: false
      - id: bu-hide-tab-close
        title: Hide tab close button
        type: class-toggle
        default: false
      - id: bu-hide-sidebar-toggle-left
        title: Hide left sidebar toggle
        type: class-toggle
        default: false
      - id: bu-hide-sidebar-toggle-right
        title: Hide right sidebar toggle
        type: class-toggle
        default: false
      - id: bu-hide-folder-arrow
        title: Hide folder collapse arrow
        type: class-toggle
        default: false
      - id: bu-hide-prompt-instructions
        title: Hide command-palette instructions
        type: class-toggle
        default: false
      - id: bu-anim-heading
        title: Animation
        description: CRT power-on, scanning line, the Rolodex lift and other eased motions (the master toggle gates all).
        type: heading
        level: 2
        collapsed: true
      - id: bu-anim
        title: Animations
        description: Restrained, CRT-flavoured transitions. Turn off to disable all motion.
        type: class-toggle
        default: true
      - id: bu-anim-speed
        title: Animation speed (ms)
        description: Entrance speed. Hover/state transitions run at ~0.3× this for responsiveness.
        type: variable-number-slider
        default: 600
        min: 400
        max: 1000
        step: 20
      - id: bu-anim-ease
        title: Animation easing
        description: The motion curve for entrances and transitions.
        type: class-select
        default: bu-ease-default
        allowEmpty: false
        options:
          - label: Ease-out (snappy)
            value: bu-ease-default
          - label: Smooth (ease-in-out)
            value: bu-ease-smooth
          - label: Linear
            value: bu-ease-linear
      - id: bu-poweron
        title: CRT power-on (on note/pane open)
        description: A quick scan-in flicker when a note or pane first opens.
        type: class-toggle
        default: true
      - id: bu-bootflash
        title: Boot sequence (CRT switch-on, on app launch)
        description: A bright slit fires across the screen and blooms into a soft wash of light as the app launches — the beam striking the glass before the workspace warms in.
        type: class-toggle
        default: true
      - id: bu-glow-ease
        title: Ease the phosphor glow
        description: Ramp the CRT text-glow in smoothly instead of snapping it on.
        type: class-toggle
        default: true
      - id: bu-menu-fade
        title: Fade menus & modals
        description: Menus, modals and popovers fade and scale in instead of appearing instantly.
        type: class-toggle
        default: true
      - id: bu-tooltip-type
        title: Typewriter tooltips
        description: Tooltips type in left-to-right like a typewriter (single-line; turn off if long tooltips clip).
        type: class-toggle
        default: true
      - id: bu-scan-anim
        title: Scanning line
        description: A faint white line scans down the editor; stays steady, then glitches now and then (the static scanlines stay still).
        type: class-toggle
        default: true
      - id: bu-scan-bright
        title: Scanning line — brightness
        description: How bright the moving scan line is.
        type: variable-number-slider
        default: 0.2
        min: 0.05
        max: 0.6
        step: 0.01
      - id: bu-scan-interval
        title: Scanning line — glitch every (sec)
        description: How often the loose-wire blink-burst happens.
        type: variable-number-slider
        default: 7
        min: 2
        max: 20
        step: 1
      - id: bu-scan-dip
        title: Scanning line — glitch depth
        description: How far the line blinks out during a glitch (0 = fully out / most violent).
        type: variable-number-slider
        default: 0
        min: 0
        max: 0.7
        step: 0.05
      - id: bu-glow-pulse
        title: Breathe the ambient glow
        description: Slowly pulse the accent glow at the window edge.
        type: class-toggle
        default: true
      - id: bu-block-caret
        title: Terminal block caret
        description: Use a solid block cursor instead of the thin caret.
        type: class-toggle
        default: true
      - id: bu-line-scan
        title: Active-line scan sweep
        description: Sweep a faint accent gradient across the line you're editing.
        type: class-toggle
        default: false
      - id: bu-flicker
        title: CRT flicker (subtle)
        description: A barely-there brightness flicker over the whole window.
        type: class-toggle
        default: false
      - id: bu-crossfade
        title: Channel-change crossfade (note switch)
        description: Briefly crossfade the editor when you switch notes.
        type: class-toggle
        default: true
      - id: bu-check-anim
        title: Eased checkbox tick
        description: Pop checkboxes with a small eased animation when ticked.
        type: class-toggle
        default: true
      - id: bu-limelight
        title: Limelight (spotlight active pane)
        description: Dim every pane but the one you're working in — notes and sidebars. Hover a dimmed pane to peek.
        type: class-toggle
        default: false
      - id: bu-respect-motion
        title: Respect "reduce motion"
        description: Honor the OS reduced-motion setting — disables animation when the system asks. (Phones/tablets are auto-lightened regardless — heavy effects are dropped on mobile by default.)
        type: class-toggle
        default: true
      - id: bu-handles-heading
        title: Resize handles
        description: The divider lines between the sidebars and the editor — strip them, or recolour them.
        type: heading
        level: 2
        collapsed: true
      - id: bu-no-handles
        title: Remove resize handles
        description: Drop the sidebar split divider lines for a seamless edge.
        type: class-toggle
        default: false
      - id: bu-handle-custom
        title: Custom resize-handle colour
        description: Recolour the divider lines with the colour below instead of the theme default.
        type: class-toggle
        default: false
      - id: bu-handle-color
        title: ↳ Resize-handle colour
        description: Used when "Custom resize-handle colour" is on (and ignored when handles are removed).
        type: variable-color
        format: hex
        opacity: false
        default: '#2a2620'
        alt-format: []
      - id: bu-scrollbar-heading
        title: Scrollbars
        description: Hide the scrollbars, or set their width and thumb colour.
        type: heading
        level: 2
        collapsed: true
      - id: bu-hide-scrollbar
        title: Hide scrollbars
        description: Hide every scrollbar while the content stays scrollable (wheel, trackpad, keys).
        type: class-toggle
        default: false
      - id: bu-scrollbar-fade
        title: Fade scrollbars (show on hover)
        description: Keep the scrollbar thumb invisible until the pointer is over the scroll area, then show it (covers wheel, trackpad and dragging the grip). A true idle-timeout fade on touch needs a plugin.
        type: class-toggle
        default: false
      - id: bu-scrollbar-fade-delay-n
        title: ↳ Fade-out delay (ms)
        description: With Fade on, how long the thumb lingers after the pointer leaves the scroll area before it fades out. (Needs your build to animate scrollbar transitions; if it snaps, only a plugin can time it.)
        type: variable-number-slider
        default: 1500
        min: 0
        max: 5000
        step: 100
      - id: bu-scrollbar-accent
        title: Accent the thumb while scrolling
