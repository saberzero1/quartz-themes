mode: replace
sections:
  - name: Bumblebee theme settings
    id: bumblebee
    collapsed: false
    settings:
      - id: headers-underline
        title: Headers underline
        type: heading
        level: 1
        collapsed: true
      - id: h1-underline
        title: H1 header underline
        type: class-toggle
      - id: h2-underline
        title: H2 header underline
        type: class-toggle
      - id: headers
        title: Headers colors
        type: heading
        level: 1
        collapsed: true
      - id: all-headers
        title: All headers
        type: heading
        level: 3
        collapsed: true
      - id: headers-one-color
        title: All headers are the same color
        type: class-toggle
        default: true
      - id: h-color-theme
        title: Header color
        type: variable-themed-color
        opacity: false
        format: hex
        default-light: '#000000'
        default-dark: '#FFFFFF'
        alt-format: []
      - id: particular-headers
        title: Particular headers
        description: These settings won't work if `All headers are the same color` is ON
        type: heading
        level: 3
        collapsed: true
      - id: h1-color-theme
        title: H1 color
        type: variable-themed-color
        opacity: false
        format: hex
        default-light: '#000000'
        default-dark: '#FFFFFF'
        alt-format: []
      - id: h2-color-theme
        title: H2 color
        type: variable-themed-color
        opacity: false
        format: hex
        default-light: '#000000'
        default-dark: '#FFFFFF'
        alt-format: []
      - id: h3-color-theme
        title: H3 color
        type: variable-themed-color
        opacity: false
        format: hex
        default-light: '#000000'
        default-dark: '#FFFFFF'
        alt-format: []
      - id: h4-color-theme
        title: H4 color
        type: variable-themed-color
        opacity: false
        format: hex
        default-light: '#000000'
        default-dark: '#FFFFFF'
        alt-format: []
      - id: h5-color-theme
        title: H5 color
        type: variable-themed-color
        opacity: false
        format: hex
        default-light: '#000000'
        default-dark: '#FFFFFF'
        alt-format: []
      - id: h6-color-theme
        title: H6 color
        type: variable-themed-color
        opacity: false
        format: hex
        default-light: '#000000'
        default-dark: '#FFFFFF'
        alt-format: []
      - id: kanban
        title: Kanban
        type: heading
        level: 1
        collapsed: true
      - id: kanban-variant
        title: Kanban variant
        description: Variations of Kanban styles
        type: class-select
        allowEmpty: false
        default: kanban-full
        options:
          - label: Full style
            value: kanban-full
          - label: Minimal style
            value: kanban-on
          - label: Disable styles
            value: kanban-off
      - id: kanban-same-height-cards
        title: Minimal height for cards
        description: All cards will have the same initial height
        type: class-toggle
        default: true
      - id: kanban-full-height-column
        title: Full height lists
        type: class-toggle
        default: true
