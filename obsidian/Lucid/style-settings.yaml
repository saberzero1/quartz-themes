mode: replace
sections:
  - name: Lucid
    id: mywiki-glass
    collapsed: false
    settings:
      - id: mwg-info
        title: Lucid
        description: Obsidian Glass palette (violet + teal). All colors, fonts and layout below drive the whole theme and its custom features.
        type: info-text
        markdown: false
      - id: mwg-colors-heading
        title: 🎨 Colors
        type: heading
        level: 1
        collapsed: true
      - id: mwg-accent
        title: Primary accent
        description: Blue by default. Drives links, active states, glows.
        type: variable-themed-color
        format: hex
        opacity: false
        default-light: '#2a5fd6'
        default-dark: '#3d8fe6'
        alt-format: []
      - id: mwg-accent-2
        title: Secondary accent
        description: Teal by default. Used in gradients and hover links.
        type: variable-themed-color
        format: hex
        opacity: false
        default-light: '#3d82d0'
        default-dark: '#5ad0c0'
        alt-format: []
      - id: mwg-gold
        title: Folder / highlight gold
        type: variable-themed-color
        format: hex
        opacity: false
        default-light: '#b07d20'
        default-dark: '#d9a441'
        alt-format: []
      - id: mwg-danger
        title: Danger / close
        type: variable-themed-color
        format: hex
        opacity: false
        default-light: '#c34a26'
        default-dark: '#e0623f'
        alt-format: []
      - id: mwg-bg-0
        title: App background (deepest)
        type: variable-themed-color
        format: hex
        opacity: false
        default-light: '#f7f8fb'
        default-dark: '#0a0a0b'
        alt-format: []
      - id: mwg-editor
        title: Editor / note background
        type: variable-themed-color
        format: hex
        opacity: false
        default-light: '#ffffff'
        default-dark: '#0a0a0b'
        alt-format: []
      - id: mwg-pane
        title: Sidebar background
        type: variable-themed-color
        format: hex
        opacity: false
        default-light: '#f2f4f9'
        default-dark: '#0e0e10'
        alt-format: []
      - id: mwg-pane-2
        title: Card / raised panel background
        type: variable-themed-color
        format: hex
        opacity: false
        default-light: '#eaedf4'
        default-dark: '#161618'
        alt-format: []
      - id: mwg-text
        title: Body text
        type: variable-themed-color
        format: hex
        opacity: false
        default-light: '#1a1a1a'
        default-dark: '#ececec'
        alt-format: []
      - id: mwg-text-strong
        title: Headings / strong text
        type: variable-themed-color
        format: hex
        opacity: false
        default-light: '#14120e'
        default-dark: '#fbfbfa'
        alt-format: []
      - id: mwg-muted
        title: Muted text
        type: variable-themed-color
        format: hex
        opacity: false
        default-light: '#5c5a55'
        default-dark: '#a3a2a0'
        alt-format: []
      - id: mwg-faint
        title: Faint text / icons
        type: variable-themed-color
        format: hex
        opacity: false
        default-light: '#8a8780'
        default-dark: '#6e6d6b'
        alt-format: []
      - id: mwg-code-fg
        title: Inline code color
        type: variable-themed-color
        format: hex
        opacity: false
        default-light: '#1f5fd0'
        default-dark: '#9ccbff'
        alt-format: []
      - id: mwg-tag-graph-sub
        title: Tag & graph colors
        type: heading
        level: 2
        collapsed: true
      - id: mwg-tag-blue
        title: Tag tint — blue (cloud / platform)
        type: variable-themed-color
        format: hex
        opacity: false
        default-light: '#5b9bd5'
        default-dark: '#5b9bd5'
        alt-format: []
      - id: mwg-tag-green
        title: Tag tint — green (data / pipeline)
        type: variable-themed-color
        format: hex
        opacity: false
        default-light: '#4cb782'
        default-dark: '#4cb782'
        alt-format: []
      - id: mwg-tag-amber
        title: Tag tint — amber (storage / db)
        type: variable-themed-color
        format: hex
        opacity: false
        default-light: '#d9a441'
        default-dark: '#d9a441'
        alt-format: []
      - id: mwg-tag-rose
        title: Tag tint — rose (people / meta)
        type: variable-themed-color
        format: hex
        opacity: false
        default-light: '#e0708a'
        default-dark: '#e0708a'
        alt-format: []
      - id: mwg-graph
        title: Graph node color
        type: variable-themed-color
        format: hex
        opacity: false
        default-light: '#2a2733'
        default-dark: '#ccc9e8'
        alt-format: []
      - id: mwg-graph-line
        title: Graph edge color
        type: variable-themed-color
        format: rgb
        opacity: true
        default-light: rgba(20, 18, 14, 0.18)
        default-dark: rgba(236, 236, 236, 0.16)
        alt-format: []
