        default: 40
        min: 24
        max: 64
        step: 1
        format: px
      - id: h1-size
        title: H1 size
        type: variable-number-slider
        default: 1.9
        min: 1.2
        max: 3
        step: 0.05
        format: em
      - id: h2-size
        title: H2 size
        type: variable-number-slider
        default: 1.5
        min: 1.1
        max: 2.5
        step: 0.05
        format: em
      - id: h3-size
        title: H3 size
        type: variable-number-slider
        default: 1.28
        min: 1
        max: 2
        step: 0.05
        format: em
      - id: h4-size
        title: H4 size
        type: variable-number-slider
        default: 1.1
        min: 0.9
        max: 1.8
        step: 0.05
        format: em
      - id: h5-size
        title: H5 size
        type: variable-number-slider
        default: 1
        min: 0.8
        max: 1.6
        step: 0.05
        format: em
      - id: h6-size
        title: H6 size
        type: variable-number-slider
        default: 0.9
        min: 0.7
        max: 1.4
        step: 0.05
        format: em
      - id: mwg-heading-weight
        title: Heading weight
        type: variable-number-slider
        default: 500
        min: 300
        max: 800
        step: 100
      - id: mwg-head-colors
        title: Heading colors (H1–H6)
        description: Color-coded headings, like the vault snippet.
        type: heading
        level: 2
        collapsed: true
      - id: mwg-h1
        title: H1 color
        type: variable-themed-color
        format: hex
        opacity: false
        default-light: '#14120e'
        default-dark: '#fbfbfa'
        alt-format: []
      - id: mwg-h2
        title: H2 color
        type: variable-themed-color
        format: hex
        opacity: false
        default-light: '#14120e'
        default-dark: '#fbfbfa'
        alt-format: []
      - id: mwg-h3
        title: H3 color
        type: variable-themed-color
        format: hex
        opacity: false
        default-light: '#2a2d34'
        default-dark: '#eaedf5'
        alt-format: []
      - id: mwg-h4
        title: H4 color
        type: variable-themed-color
        format: hex
        opacity: false
        default-light: '#3a3d44'
        default-dark: '#ececec'
        alt-format: []
      - id: mwg-h5
        title: H5 color
        type: variable-themed-color
        format: hex
        opacity: false
        default-light: '#4a4d54'
        default-dark: '#ececec'
        alt-format: []
      - id: mwg-h6
        title: H6 color
        type: variable-themed-color
        format: hex
        opacity: false
        default-light: '#5a5d64'
        default-dark: '#a3a2a0'
        alt-format: []
      - id: mwg-format-colors
        title: Text format colors
        description: Bold / italic / strikethrough.
        type: heading
        level: 2
        collapsed: true
      - id: mwg-bold-color
        title: Bold color
        type: variable-themed-color
        format: hex
        opacity: false
        default-light: '#14120e'
        default-dark: '#fbfbfa'
        alt-format: []
      - id: mwg-italic-color
        title: Italic / emphasis color
        description: Teal by default — different from the blue accent. Also colors *em* in headings & cards.
        type: variable-themed-color
        format: hex
        opacity: false
        default-light: '#0d7d72'
        default-dark: '#4fd0bf'
        alt-format: []
      - id: mwg-bold-italic-color
        title: Bold + italic color
        type: variable-themed-color
        format: hex
        opacity: false
        default-light: '#0d7d72'
        default-dark: '#4fd0bf'
        alt-format: []
      - id: mwg-strikethrough-color
