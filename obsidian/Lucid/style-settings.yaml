        type: variable-themed-color
        format: hex
        opacity: false
        default-light: '#b07d20'
        default-dark: '#d9a441'
        alt-format: []
      - id: mwg-callout-question
        title: Question / help / FAQ
        type: variable-themed-color
        format: hex
        opacity: false
        default-light: '#b07d20'
        default-dark: '#d9a441'
        alt-format: []
      - id: mwg-callout-danger
        title: Failure / danger / error / bug
        type: variable-themed-color
        format: hex
        opacity: false
        default-light: '#c34a26'
        default-dark: '#e0623f'
        alt-format: []
      - id: mwg-callout-example
        title: Example
        type: variable-themed-color
        format: hex
        opacity: false
        default-light: '#7a6a8e'
        default-dark: '#a890be'
        alt-format: []
      - id: mwg-callout-quote
        title: Quote / cite
        type: variable-themed-color
        format: hex
        opacity: false
        default-light: '#7a6a8e'
        default-dark: '#a890be'
        alt-format: []
      - id: mwg-shape-heading
        title: 🟦 Shape & motion
        type: heading
        level: 1
        collapsed: true
      - id: mwg-radius
        title: Roundness
        type: variable-number-slider
        default: 8
        min: 0
        max: 16
        step: 1
        format: px
      - id: mwg-scrollbar
        title: Scrollbar width
        type: variable-number-slider
        default: 6
        min: 3
        max: 16
        step: 1
        format: px
      - id: mwg-no-anim
        title: Disable animations
        description: Turn off entrance + hover motion (also respects OS reduced-motion).
        type: class-toggle
        addCommand: true
      - id: mwg-head-underline-width
        title: Heading underline width
        type: variable-number-slider
        default: 1
        min: 0
        max: 6
        step: 1
        format: px
      - id: mwg-no-head-underline
        title: Disable heading underline
        type: class-toggle
      - id: mwg-bg-glow
        title: Accent background glow (Glass wash)
        description: Re-adds the soft violet glow behind the app. Off = flat near-black like the reference.
        type: class-toggle
        addCommand: true
      - id: mwg-editorial-heading
        title: ✒️ Editorial & polish
        type: heading
        level: 1
        collapsed: true
      - id: mwg-drop-cap
        title: Editorial drop cap
        description: Large serif initial on the first paragraph of a note (reading view + live preview).
        type: class-toggle
        default: true
        addCommand: true
      - id: mwg-drop-cap-size
        title: Drop cap size
        type: variable-number-slider
        default: 3.1
        min: 2
        max: 6
        step: 0.1
        format: em
      - id: mwg-drop-cap-solid
        title: Solid drop cap (no gradient)
        description: Fill the drop cap with a flat accent color instead of the violet→teal gradient.
        type: class-toggle
      - id: mwg-quote-mark-opacity
        title: Quote mark opacity
        description: Strength of the oversized quotation mark behind blockquotes.
        type: variable-number-slider
        default: 0.1
        min: 0
        max: 0.4
        step: 0.01
      - id: mwg-hr-gem-size
        title: Divider gem size
        description: Size of the diamond ornament in the center of "---" dividers.
        type: variable-number-slider
        default: 7
        min: 0
        max: 16
        step: 1
        format: px
      - id: mwg-heading-letter-spacing
        title: Heading letter spacing
        type: variable-number-slider
        default: -0.01
        min: -0.05
        max: 0.1
        step: 0.005
        format: em
      - id: mwg-para-spacing
        title: Paragraph spacing
        description: Vertical gap below each paragraph.
        type: variable-number-slider
        default: 11
        min: 0
        max: 28
        step: 1
        format: px
      - id: mwg-heading-align
        title: Default heading alignment
        description: Aligns all headings (both views). Per-heading "#center /
        type: class-select
        allowEmpty: false
        default: mwg-halign-left
        options:
          - label: Left
            value: mwg-halign-left
          - label: Center
            value: mwg-halign-center
          - label: Right
            value: mwg-halign-right
