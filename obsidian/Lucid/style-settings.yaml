      - id: file-line-width
        title: Note width (readable line length)
        type: variable-number-slider
        default: 760
        min: 500
        max: 1600
        step: 20
        format: px
      - id: font-text-size
        title: Body font size
        type: variable-number-slider
        default: 16
        min: 12
        max: 22
        step: 1
        format: px
      - id: line-height-normal
        title: Line height
        type: variable-number-slider
        default: 1.55
        min: 1.2
        max: 2.2
        step: 0.05
      - id: bold-weight
        title: Bold weight
        type: variable-number-slider
        default: 700
        min: 400
        max: 900
        step: 100
      - id: nav-item-size
        title: Sidebar font size
        type: variable-number-slider
        default: 14
        min: 11
        max: 18
        step: 1
        format: px
