        type: variable-themed-color
        format: hex
        opacity: false
        default-light: '#5c5a55'
        default-dark: '#a3a2a0'
        alt-format: []
      - id: mwg-callouts-heading
        title: 🗨️ Callout colors
        description: 'One accent per callout type. Same syntax as ITS: > [!tip], > [!warning], etc.'
        type: heading
        level: 1
        collapsed: true
      - id: mwg-callout-note
        title: Note / info / summary / abstract
        type: variable-themed-color
        format: hex
        opacity: false
        default-light: '#2a5fd6'
        default-dark: '#3d8fe6'
        alt-format: []
      - id: mwg-callout-tip
        title: Tip / success / important / done
        type: variable-themed-color
        format: hex
        opacity: false
        default-light: '#3d82d0'
        default-dark: '#5ad0c0'
        alt-format: []
      - id: mwg-callout-warning
