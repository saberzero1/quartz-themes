mode: replace
sections:
  - name: Atelier
    id: anthropic-touch
    collapsed: false
    settings:
      - id: at-info
        title: Atelier
        description: Warm cream paper + coral accent, inspired by the open-design.ai community page. Colors, fonts, layout and the per-element style variants below drive the whole theme.
        type: info-text
        markdown: false
      - id: at-colors-heading
        title: 🎨 Colors
        type: heading
        level: 1
        collapsed: true
      - id: at-accent
        title: Primary accent
        description: Coral by default. Drives links, labels, active states.
        type: variable-themed-color
        format: hex
        opacity: false
        default-light: '#d8552f'
        default-dark: '#e8714c'
        alt-format: []
      - id: at-accent-2
        title: Secondary accent
        description: Deeper terracotta. Used in gradients and hover links.
        type: variable-themed-color
        format: hex
        opacity: false
        default-light: '#b8442a'
        default-dark: '#d2603f'
        alt-format: []
      - id: at-gold
        title: Folder / highlight gold
        type: variable-themed-color
        format: hex
        opacity: false
        default-light: '#b07d20'
        default-dark: '#d9a441'
        alt-format: []
      - id: at-danger
        title: Danger / close
        type: variable-themed-color
        format: hex
        opacity: false
        default-light: '#c0392b'
        default-dark: '#e0623f'
        alt-format: []
      - id: at-bg-0
        title: App background (deepest)
        type: variable-themed-color
        format: hex
        opacity: false
        default-light: '#ece3d0'
        default-dark: '#14110c'
        alt-format: []
      - id: at-editor
        title: Editor / note background
        type: variable-themed-color
        format: hex
        opacity: false
        default-light: '#f7f1e4'
        default-dark: '#14110c'
        alt-format: []
      - id: at-pane
        title: Sidebar background
        type: variable-themed-color
        format: hex
        opacity: false
        default-light: '#efe7d6'
        default-dark: '#1a160f'
        alt-format: []
      - id: at-pane-2
        title: Card / raised panel background
        type: variable-themed-color
        format: hex
        opacity: false
        default-light: '#f6f1e6'
        default-dark: '#211c14'
        alt-format: []
      - id: at-dark-surface
        title: Dark card surface (honor / CTA cards)
        description: Used by card v4 / v5; intentionally dark in both light and dark mode.
        type: variable-themed-color
        format: hex
        opacity: false
        default-light: '#1a1510'
        default-dark: '#231d14'
        alt-format: []
      - id: at-text
        title: Body text
        type: variable-themed-color
        format: hex
        opacity: false
        default-light: '#3a352c'
        default-dark: '#e7ddc8'
        alt-format: []
      - id: at-text-strong
        title: Headings / strong text
        type: variable-themed-color
        format: hex
        opacity: false
        default-light: '#1f1b14'
        default-dark: '#f5efe1'
        alt-format: []
      - id: at-muted
        title: Muted text
        type: variable-themed-color
        format: hex
        opacity: false
        default-light: '#8a7f6d'
        default-dark: '#a99e87'
        alt-format: []
      - id: at-type-heading
        title: 🔤 Fonts & typography
        type: heading
        level: 1
        collapsed: true
      - id: at-system-fonts
        title: Use system fonts
        description: Skip the bundled Google fonts (faster / offline / mobile).
        type: class-toggle
        addCommand: true
      - id: at-font-body
        title: Body & interface font
        description: Pick from common system fonts.
        type: variable-select
        default: '''Inter'', system-ui, sans-serif'
        options:
          - label: System default (sans)
            value: system-ui, -apple-system, 'Segoe UI', sans-serif
          - label: Segoe UI
            value: '''Segoe UI'', system-ui, sans-serif'
