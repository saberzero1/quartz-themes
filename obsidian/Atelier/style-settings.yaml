        options:
          - label: System default (sans)
            value: system-ui, -apple-system, 'Segoe UI', sans-serif
          - label: Segoe UI
            value: '''Segoe UI'', system-ui, sans-serif'
          - label: Segoe UI Variable
            value: '''Segoe UI Variable Display'', ''Segoe UI'', system-ui, sans-serif'
