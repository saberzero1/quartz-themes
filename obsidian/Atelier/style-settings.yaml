            value: '''Lora'', Georgia, serif'
          - label: Playfair Display (serif)
            value: '''Playfair Display'', Georgia, serif'
      - id: at-font-mono
        title: Monospace / label font
        description: Pick from common system fonts.
        type: variable-select
        default: '''JetBrains Mono'', ui-monospace, monospace'
        options:
          - label: JetBrains Mono
            value: '''JetBrains Mono'', ui-monospace, monospace'
          - label: Cascadia Code
            value: '''Cascadia Code'', ui-monospace, monospace'
          - label: Cascadia Mono
            value: '''Cascadia Mono'', ui-monospace, monospace'
          - label: Consolas
            value: Consolas, ui-monospace, monospace
          - label: SF Mono / system
            value: ui-monospace, SFMono-Regular, Menlo, monospace
          - label: Menlo
            value: Menlo, Monaco, monospace
          - label: Monaco
            value: Monaco, Menlo, monospace
          - label: Fira Code
            value: '''Fira Code'', ui-monospace, monospace'
          - label: Fira Mono
            value: '''Fira Mono'', ui-monospace, monospace'
          - label: Source Code Pro
            value: '''Source Code Pro'', ui-monospace, monospace'
          - label: IBM Plex Mono
            value: '''IBM Plex Mono'', ui-monospace, monospace'
          - label: Roboto Mono
            value: '''Roboto Mono'', ui-monospace, monospace'
          - label: Courier New
            value: '''Courier New'', Courier, monospace'
          - label: Lucida Console
            value: '''Lucida Console'', Monaco, monospace'
      - id: file-line-width
        title: Note width (readable line length)
        type: variable-number-slider
        default: 760
        min: 500
        max: 1600
        step: 20
        format: px
      - id: font-text-size
        title: Body font size
        type: variable-number-slider
        default: 16
        min: 12
        max: 22
        step: 1
        format: px
      - id: line-height-normal
        title: Line height
        type: variable-number-slider
        default: 1.6
        min: 1.2
        max: 2.2
        step: 0.05
      - id: bold-weight
        title: Bold weight
        type: variable-number-slider
        default: 700
        min: 400
        max: 900
        step: 100
      - id: nav-item-size
        title: Sidebar font size
        type: variable-number-slider
        default: 14
        min: 11
        max: 18
        step: 1
        format: px
      - id: inline-title-size
        title: Inline title size
        type: variable-number-slider
        default: 42
        min: 24
        max: 64
        step: 1
        format: px
      - id: h1-size
        title: H1 size
        type: variable-number-slider
        default: 2
        min: 1.2
        max: 3
        step: 0.05
        format: em
      - id: h2-size
        title: H2 size
        type: variable-number-slider
        default: 1.55
        min: 1.1
        max: 2.5
        step: 0.05
        format: em
      - id: h3-size
        title: H3 size
        type: variable-number-slider
        default: 1.3
        min: 1
        max: 2
        step: 0.05
        format: em
      - id: at-variants-heading
        title: 🧩 Element style variants
        type: heading
        level: 1
        collapsed: true
      - id: at-card-default
        title: Default card style
        description: Style for a bare > [!card]. Override any card inline, e.g. > [!card|profile] or > [!card|honor]. Combine surfaces (dark / accent) and spans (span2 / spanfull). Wrap cards in > [!grid] to flow them into columns.
        type: class-select
        allowEmpty: false
        default: at-card-plain
        options:
          - label: Plain card
            value: at-card-plain
          - label: Skill / numbered steps
            value: at-card-skill
          - label: Section (roman column)
            value: at-card-section
          - label: Step
            value: at-card-step
          - label: Profile
            value: at-card-profile
          - label: Honor (dark)
            value: at-card-honor
          - label: Channels (dark)
            value: at-card-channels
          - label: Hero / CTA
            value: at-card-hero
      - id: at-card-min
        title: Card grid — min card width
        description: Cards inside > [!grid] flow into as many columns as fit at this minimum width.
        type: variable-number-slider
        default: 260
        min: 160
        max: 480
        step: 10
        format: px
      - id: at-infobox-default
        title: Default infobox style
        description: Style for a bare > [!infobox]. Override inline with |v1 … |v3. Add |left to float left.
        type: class-select
        allowEmpty: false
        default: at-ib-v1
        options:
          - label: v1 — Floated cream card
            value: at-ib-v1
          - label: v2 — Dark honor card
            value: at-ib-v2
          - label: v3 — Flat bordered
            value: at-ib-v3
      - id: at-tag-style
        title: Tag style
        description: How
        type: class-select
        allowEmpty: false
        default: at-tag-pill
        options:
          - label: Pill
            value: at-tag-pill
          - label: Outline
            value: at-tag-outline
          - label: Mono caps
            value: at-tag-mono
          - label: Underline
            value: at-tag-underline
      - id: at-heading-style
        title: Heading style
        description: Decoration for h1–h3. Italic words inside headings always show the coral emphasis.
        type: class-select
        allowEmpty: false
        default: at-head-serif
        options:
          - label: Serif display (thin coral rule)
            value: at-head-serif
          - label: Mono caps labels
            value: at-head-mono
          - label: Underlined
            value: at-head-underline
          - label: Plain
            value: at-head-plain
      - id: at-editorial-heading
        title: ✒️ Editorial & polish
        type: heading
        level: 1
        collapsed: true
      - id: at-heading-letter-spacing
        title: Heading letter spacing
        type: variable-number-slider
        default: -0.01
        min: -0.05
        max: 0.1
        step: 0.005
        format: em
      - id: at-para-spacing
        title: Paragraph spacing
        type: variable-number-slider
        default: 12
        min: 0
        max: 28
        step: 1
        format: px
      - id: at-radius
        title: Corner radius
        type: variable-number-slider
        default: 12
        min: 0
        max: 24
        step: 1
        format: px
      - id: at-heading-align
        title: Default heading alignment
        description: Per-heading "#center /
        type: class-select
        allowEmpty: false
        default: at-halign-left
        options:
          - label: Left
            value: at-halign-left
          - label: Center
            value: at-halign-center
          - label: Right
            value: at-halign-right
      - id: at-features-heading
        title: ⚙️ Features & motion
        type: heading
        level: 1
        collapsed: true
      - id: at-no-anim
        title: Disable animations
        description: Turn off entrance + hover motion (also respects OS reduced-motion).
        type: class-toggle
        addCommand: true
      - id: at-scroll-reveal
        title: Scroll reveal
        description: Headings, callouts and quotes fade-rise as they scroll into view.
        type: class-toggle
        default: true
        addCommand: true
      - id: at-active-line
        title: Highlight active line (editor)
        type: class-toggle
        addCommand: true
      - id: at-infobox-width
        title: Infobox width
        type: variable-number-slider
        default: 300
        min: 200
        max: 460
        step: 10
        format: px
      - id: callout-min-width
        title: Multi-column — min sub-callout width
        type: variable-number-slider
        default: 200
        min: 100
        max: 500
        step: 20
        format: px
      - id: at-grad-color
        title: Gradient-text color (.at-gradient)
        description: The .at-gradient class is a single accent colour here (it's a gradient in MyWiki Glass). Use <span class="at-gradient">…</span>.
        type: variable-themed-color
        format: hex
        opacity: false
        default-light: '#d8552f'
        default-dark: '#e8714c'
        alt-format: []
