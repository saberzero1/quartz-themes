          - label: Ubuntu
            value: '''Ubuntu'', system-ui, sans-serif'
          - label: Noto Sans
            value: '''Noto Sans'', system-ui, sans-serif'
          - label: Helvetica Neue
            value: '''Helvetica Neue'', Helvetica, Arial, sans-serif'
          - label: Arial
            value: Arial, Helvetica, sans-serif
          - label: Calibri
            value: Calibri, system-ui, sans-serif
          - label: Candara
            value: Candara, system-ui, sans-serif
          - label: Corbel
            value: Corbel, system-ui, sans-serif
          - label: Verdana
            value: Verdana, Geneva, sans-serif
          - label: Tahoma
            value: Tahoma, Geneva, sans-serif
          - label: Trebuchet MS
            value: '''Trebuchet MS'', Tahoma, sans-serif'
          - label: Franklin Gothic
            value: '''Franklin Gothic'', ''Franklin Gothic Medium'', sans-serif'
          - label: Century Gothic
            value: '''Century Gothic'', sans-serif'
          - label: Gill Sans
            value: '''Gill Sans'', ''Gill Sans MT'', sans-serif'
          - label: Optima
            value: Optima, Candara, sans-serif
          - label: Avenir Next
            value: '''Avenir Next'', Avenir, sans-serif'
          - label: Georgia (serif)
            value: Georgia, 'Times New Roman', serif
